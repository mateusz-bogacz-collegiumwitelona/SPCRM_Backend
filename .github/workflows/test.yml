name: Run Tests

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches: 
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SPCRM_Backend.slnx  

      - name: Linter / Code Formatting Check
        run: dotnet format SPCRM_Backend.slnx --verify-no-changes --verbosity normal

      - name: Build
        run: dotnet build SPCRM_Backend.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet run --project Tests/Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --property:TestingPlatformDotnetTestSupport=true
          --
          --coverage
          --coverage-settings ${{ github.workspace }}/coverage.settings.xml
          --coverage-output-format cobertura
          --coverage-output ${{ github.workspace }}/coverage.cobertura.xml

      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: 'coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'MarkdownSummaryGithub;HtmlInline'

      - name: Add Coverage Summary to Job
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report